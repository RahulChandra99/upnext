<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upnext</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="nav">
    <div class="brand"><span class="logo" aria-hidden="true"></span>Upnext</div>
    <nav>
      <button class="nav-item" data-page="library"><svg viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="10" rx="2"/><path d="M7 17h6"/></svg>Library</button>
      <button class="nav-item" data-page="subtitles"><svg viewBox="0 0 20 20"><rect x="2.5" y="4" width="15" height="12" rx="2"/><path d="M6 11h3M11 11h3M6 13.5h8"/></svg>Subtitles</button>
      <button class="nav-item" data-page="activity"><svg viewBox="0 0 20 20"><path d="M10 3v9m0 0-3.5-3.5M10 12l3.5-3.5M4 15.5h12"/></svg>Activity<span class="badge" id="activeCount" hidden></span></button>
      <button class="nav-item" data-page="settings"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.8v2M10 15.2v2M2.8 10h2M15.2 10h2M4.9 4.9l1.4 1.4M13.7 13.7l1.4 1.4M4.9 15.1l1.4-1.4M13.7 6.3l1.4-1.4"/></svg>Settings</button>
    </nav>
    <div class="nav-foot" id="driveStatus"></div>
  </aside>

  <main>
    <section class="now" id="now"></section>
    <div class="page" id="page-library"></div>
    <div class="page" id="page-subtitles" hidden></div>
    <div class="page" id="page-activity" hidden></div>
    <div class="page" id="page-settings" hidden></div>
  </main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
